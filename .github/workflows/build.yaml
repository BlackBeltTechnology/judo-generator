name: Build
on:
  workflow_dispatch:
  push:
    branches:
      - "**"

env:
  NEXUS_URL: https://nexus.blackbelt.cloud
  NEXUS_USER: ${{ secrets.NEXUS_USER }}
  NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: hmarr/debug-action@v2
      - uses: actions/checkout@v3

      - name: setting vars
        run: |
          set -ex
          export BUILD_NUMBER=$((600 + $GITHUB_RUN_NUMBER))
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV

      - name: Set up JDK 8
        uses: actions/setup-java@v3
        with:
          java-version: '8'
          distribution: 'adopt'
          cache: 'maven'

      - name: Copy mvn-settings.xml
        run: cp mvn-settings.xml /home/runner/.m2/

      - name: mvn set version
        id: version
        run: |
          set -exu
          POM_VERSION=$(mvn org.apache.maven.plugins:maven-help-plugin:3.2.0:evaluate -Dexpression=project.version -q -DforceStdout)
          PROJECT_VERSION=$(echo $POM_VERSION | sed "s/-SNAPSHOT/-$BUILD_NUMBER/")
          echo "version=$PROJECT_VERSION" >> $GITHUB_OUTPUT
          mvn org.codehaus.mojo:versions-maven-plugin:2.7:set -DnewVersion=$PROJECT_VERSION
          mvn org.codehaus.mojo:versions-maven-plugin:2.7:set -DnewVersion=$PROJECT_VERSION -f hu.blackbelt.judo.generator.parent

      - name: mvn deploy to Nexus
        run: |
          set -exu
          mvn deploy -DaltDeploymentRepository=blackbelt-nexus-distribution::default::${NEXUS_URL}/repository/maven-judo-generator-release

      - name: Tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          create_annotated_tag: false
          tag_prefix: ""
          custom_tag: ${{ steps.version.outputs.version }}

      - name: Notify Slack
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            EMOJI="🟢"
          else
            EMOJI="🔴"
          fi
          
          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          BRANCH="${GITHUB_REF#refs/heads/}"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          COMMIT_MSG=$(git log -1 --pretty=%s)
          BUILD_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          
          NEWLINE=$'\n'
          TEXT="${EMOJI} *${REPO_NAME} (${BRANCH}) #${BUILD_NUMBER}*${NEWLINE}_${COMMIT_MSG}_ - ${GITHUB_ACTOR} (${SHORT_SHA})${NEWLINE}<${BUILD_URL}|View Build>"
          
          curl -X POST -H 'Content-type: application/json' \
            --data "$(jq -n --arg text "$TEXT" '{text: $text}')" \
            "$SLACK_WEBHOOK_URL"